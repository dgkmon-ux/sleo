plugins { id 'com.android.application' }
def signingKeys = ['SLEO_KEYSTORE','SLEO_KEYSTORE_PASSWORD','SLEO_KEY_ALIAS','SLEO_KEY_PASSWORD']
def hasSigning = signingKeys.every { System.getenv(it) }
android {
    namespace 'io.sleo.app'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'io.sleo.app'; minSdk 28; targetSdk 34; versionCode 1; versionName '1.0.0' }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(System.getenv('SLEO_KEYSTORE'))
                storePassword System.getenv('SLEO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SLEO_KEY_ALIAS')
                keyPassword System.getenv('SLEO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (hasSigning) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }

