name: Signed APK Android check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apk/**', 'app/**', 'tests/android*', '.github/workflows/android-smoke.yml']
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check APK and bridge
        run: |
          cd apk
          sha256sum --check SHA256SUMS.txt
          cd ..
          node tests/verify_native_bridge.mjs
      - name: Install Android emulator image
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/sleo-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sleo-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/android-tools.zip" 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $RUNNER_TEMP/android-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-34;default;x86_64'
          echo no | avdmanager create avd -n SleoCheck -k 'system-images;android-34;default;x86_64' -p "$ANDROID_AVD_HOME/SleoCheck.avd"
          cat >> "$ANDROID_AVD_HOME/SleoCheck.avd/config.ini" <<'EOF'
          hw.lcd.width=1600
          hw.lcd.height=900
          hw.lcd.density=160
          hw.initialOrientation=landscape
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          EOF
          sudo chmod 666 /dev/kvm
      - name: Start Android 14
        run: |
          mkdir -p test-output/android
          nohup "$ANDROID_HOME/emulator/emulator" -avd SleoCheck -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 > test-output/android/emulator.log 2>&1 &
          adb wait-for-device
          for n in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1600x900
          adb shell wm density 160
      - name: Exercise submitted release APK
        run: python3 tests/android_touch_smoke.py
      - name: Capture system log
        if: always()
        run: timeout --kill-after=5s 15s adb logcat -d -t 1500 > test-output/android/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-apk-android14-evidence
          path: test-output/android/
